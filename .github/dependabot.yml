# Toolchain pins live in mise.toml.
# https://github.com/Braden1996/sergeant#readme
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      workspace:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)
