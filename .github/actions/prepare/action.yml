name: Prepare the Luau checker workspace
description: Install the pinned build tools and prepare the config tarballs and WASM.

inputs:
  cache:
    description: Restore and save tools and the native WASM output in CI.
    default: "false"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      env:
        MISE_DISABLE_TOOLS: http:sgt
      with:
        cache: ${{ inputs.cache }}
    - name: Prepare Sergeant config tarballs
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ../sergeant/dist/npm
        npm pack --ignore-scripts --pack-destination ../sergeant/dist/npm \
          @sgt-build/tsconfig@0.15.0 \
          @sgt-build/oxlint-config@0.15.0 \
          @sgt-build/oxlint-config-worker@0.15.0
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      if: inputs.cache == 'true'
      with:
        path: .build/wasm-artifacts
        key: wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'packages/libraries/ts/dom/luau-web-checker/wasm/**', 'packages/libraries/ts/dom/luau-web-checker/scripts/build-wasm.effect.ts', 'packages/libraries/ts/dom/luau-web-checker/scripts/wasm-inputs.ts') }}
    - name: Prepare WASM
      shell: bash
      env:
        MISE_DISABLE_TOOLS: http:sgt
      run: bun run wasm:prepare
