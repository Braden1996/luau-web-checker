name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: Braden1996/sergeant-releases/actions/pr-title@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          scopes: wasm,api,tests,ci,site,docs,deps,repo
