name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          seal-sysctl: "true"
      - uses: ./.github/actions/prepare
      - uses: Braden1996/sergeant-releases/actions/ci@v0.15.0 # zizmor: ignore[unpinned-uses]
      - name: Find existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: Braden1996/sergeant-releases/actions/release-npm@v0.15.0 # zizmor: ignore[unpinned-uses]
        if: steps.existing.outputs.found != 'true'
        with:
          working-directory: packages/libraries/ts/dom/luau-web-checker
          changelog: ../../../../../CHANGELOG.md
          publish: "false"
      - name: Attach standalone WASM and its glue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(mktemp -d)"
          cd "$assets"
          tarball="luau-web-checker-${GITHUB_REF_NAME#v}.tgz"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$tarball" --pattern SHA256SUMS
          grep -F "  $tarball" SHA256SUMS > tarball.sha256
          sha256sum --check tarball.sha256
          tar -xOzf "$tarball" package/dist/luau-checker.wasm > luau-checker.wasm
          tar -xOzf "$tarball" package/dist/luau-checker.mjs > luau-checker.mjs
          sha256sum "$tarball" luau-checker.wasm luau-checker.mjs > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            luau-checker.wasm luau-checker.mjs SHA256SUMS
