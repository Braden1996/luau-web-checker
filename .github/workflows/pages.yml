name: pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          seal-sysctl: "true"
      - uses: ./.github/actions/prepare
      - uses: Braden1996/sergeant-releases/actions/ci@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          check: "false"
          test: "false"
          build: "false"
      - uses: Braden1996/sergeant-releases/actions/deploy-astro-pages@v0.15.0 # zizmor: ignore[unpinned-uses]
        with:
          unit: docs
          output-path: .sergeant/out/luau-web-checker/docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
