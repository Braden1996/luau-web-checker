$schema: "../.moon/cache/schemas/project.json"

# Project `site`: the documentation site (Astro + Starlight, deployed to GitHub Pages by .github/workflows/pages.yml).
# It is a Bun workspace member that uses the package from ../dist, so every task needs `repo:build` first; building
# the site type-checks every ```luau block with the package's own Expressive Code plugin. Tasks run from site/.
layer: "application"
tags: ["typescript", "docs"]

taskOptions:
  shell: false
  runFromWorkspaceRoot: false

tasks:
  typecheck:
    description: "TypeScript 7 (tsgo) over every tsconfig project, then astro check"
    command: "bun"
    args: ["run", "typecheck"]
    deps: ["repo:build"]
    options:
      cache: false
  lint:
    description: "oxlint, type-aware, warnings are errors (oxlint.config.ts)"
    command: "bun"
    args: ["run", "lint"]
    deps: ["repo:build"]
    options:
      cache: false
  fmt:
    description: "Format TypeScript and Astro with oxfmt (oxfmt.config.ts)"
    command: "bun"
    args: ["run", "fmt"]
    deps: ["repo:install"]
    options:
      cache: false
  fmt-check:
    description: "oxfmt check (run `moon run site:fmt` to fix)"
    command: "bun"
    args: ["run", "fmt:check"]
    deps: ["repo:install"]
    options:
      cache: false
  test:
    description: "bun test: the playground's examples check as they claim"
    command: "bun"
    args: ["test"]
    deps: ["repo:build"]
    options:
      cache: false
  build:
    description: "Build the static site into site/dist (every ```luau block is type-checked)"
    command: "bun"
    args: ["run", "build"]
    deps: ["repo:build"]
    options:
      cache: false
  dev:
    description: "Local dev server"
    command: "bun"
    args: ["run", "dev"]
    deps: ["repo:build"]
    preset: "server"
  check:
    description: "Aggregator: every site check, and the site builds"
    deps: ["~:typecheck", "~:lint", "~:fmt-check", "~:test", "~:build"]
