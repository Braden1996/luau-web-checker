$schema: "./cache/schemas/workspace.json"

# moon workspace. `moon run :check` is THE gate: CI runs it cold (MOON_CACHE=write), and so does the pre-push hook.
# Conventions:
# - no moon toolchain plugins: every task runs on the `system` toolchain and mise puts the pinned binaries on PATH;
# - every task is `shell: false` and runs from the workspace root;
# - the `check` task is an aggregator that only lists deps.
versionConstraint: "=2.6.5"

projects:
  repo: "."

vcs:
  client: "git"
  provider: "github"
  defaultBranch: "main"

hasher:
  # Hash only files git knows about: dist/, .build/ and node_modules/ never feed a hash.
  walkStrategy: "vcs"
  warnOnMissingInputs: true

pipeline:
  cacheLifetime: "7 days"

telemetry: false
